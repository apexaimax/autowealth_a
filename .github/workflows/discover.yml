name: discover opportunities
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Search live GitHub opportunities and demand
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVENUE_PROFILE_DEVICES: PHONE,TABLET
          REVENUE_PROFILE_WORK: GITHUB_REVIEW,CODE_ANALYSIS,DOCUMENTATION,QA,AI_ASSISTED_RESEARCH
          REVENUE_PROFILE_COUNTRIES: US
          REVENUE_PUBLIC_RECORD_KEYWORDS: artificial intelligence software,cybersecurity software,healthcare workflow software,browser automation software
        run: npm run --silent discover:github > github-opportunities.json
      - name: Update durable opportunity inbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPPORTUNITY_INBOX_BRANCH: opportunity-inbox
        run: node dist/opportunity-inbox-github-run.js github-opportunities.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-opportunities
          path: github-opportunities.json
          retention-days: 7
