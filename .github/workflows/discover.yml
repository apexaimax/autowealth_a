name: discover opportunities
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test
      - name: Search live GitHub opportunities
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run discover:github > github-opportunities.json
      - uses: actions/upload-artifact@v4
        with:
          name: github-opportunities
          path: github-opportunities.json
          retention-days: 7
